<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Focus Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title">Meet Focus Tracker</div>
    <span class="badge">Student</span>
  </header>

  <!-- Consent Notice: Displayed if consentGiven is not true -->
  <div id="consent-banner" class="consent-banner">
    <div class="consent-banner-title">
      <span>⚠️</span> Consent Required
    </div>
    <p>Please accept the consent screen first before tracking starts. Focus tracking is paused until consent is provided.</p>
  </div>

  <!-- Participant and Meeting Code inputs -->
  <div class="form-group">
    <label for="participant-name">Participant Name</label>
    <input type="text" id="participant-name" placeholder="Enter your name" autocomplete="off" />
  </div>

  <div class="form-group">
    <label for="meeting-code">Meeting Code</label>
    <input type="text" id="meeting-code" placeholder="e.g. abc-defg-hij" autocomplete="off" />
  </div>

  <!-- Real-time Focus Statistics -->
  <div class="stats-container">
    <div class="stat-card">
      <div id="switches-count" class="stat-value">0</div>
      <div class="stat-label">Switches</div>
    </div>
    <div class="stat-card">
      <div id="total-away" class="stat-value">00:00</div>
      <div class="stat-label">Time Away</div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button type="button" id="reset-btn" class="btn-reset">Reset Stats</button>
  </div>

  <footer>
    Tracks tab leave count & duration on Google Meet
  </footer>

  <script src="popup.js"></script>
</body>
</html>
